[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ail-mcp"
version = "0.1.0"
description = "AILv1 (Agent Intermediate Language) context compressor: CLI and MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ail-mcp = "ail_mcp:main"

[tool.hatch.build.targets.wheel]
only-include = ["skills/ail-context-compressor/scripts/ail_mcp.py"]

[tool.hatch.build.targets.wheel.sources]
"skills/ail-context-compressor/scripts" = ""

[tool.hatch.build.targets.sdist]
include = ["skills/", "tests/", "benchmarks/", "verify_ail.py", "README.md", "SECURITY.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
